[package]
name = "sahib-desktop"
version = "0.2.4"
description = "Sahib Islamic daily companion for Windows"
authors = ["Sahib contributors"]
edition = "2021"
rust-version = "1.80"

[features]
default = ["native-widget-rc", "brand-preview"]
native-widget-experiment = ["dep:windows-sys", "dep:windows", "dep:windows-core", "tauri/unstable", "dep:webview2-com"]
native-widget-rc = ["native-widget-experiment"]
brand-preview = []
desktop-qa = []

[lib]
name = "sahib_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rodio = { version = "0.21.1", default-features = false, features = ["playback", "symphonia-all"] }
windows-sys = { version = "0.61.2", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse"] }
windows = { version = "0.62.2", optional = true, features = ["Win32_Foundation", "Win32_Graphics_DirectWrite", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Variant"] }
windows-core = { version = "0.62.2", optional = true }
webview2-com = { version = "0.39.1", optional = true }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"

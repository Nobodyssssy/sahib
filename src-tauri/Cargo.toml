[package]
name = "sahib-desktop"
version = "0.1.1"
description = "Sahib Islamic daily companion for Windows"
authors = ["Sahib contributors"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "sahib_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rodio = { version = "0.21.1", default-features = false, features = ["playback", "symphonia-all"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
